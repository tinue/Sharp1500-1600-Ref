# Catalogue of the primary sources behind this repository.
# `id` is what documents cite, as [S:<id> p.<n>] (see CONVENTIONS.md). `local` is where the maintainer's scan lives;
# the scans are not in git (copyright). A source without `local` is one the maintainer does not hold as a file.
sources:
  - id: TRM-1600
    title: "PC-1600 Technical Reference Manual (English), (c) 1986, back cover 6L 3.0-I (TMANE1005ECZZ)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/PC-1600_Technical_Reference_Manual.pdf"
    note: "313 PDF pages. Same content as SYSHB-1600 (German); the German scan is cleaner and most transcription was read from it. Chapter 9 circuit diagrams are too coarse in the scan; photos of the printed pages were used (9.1(1) p.264, 9.1(4) p.267, 9.2(1) p.268)."
  - id: SYSHB-1600
    title: "SHARP Pocket Computer PC-1600 System-Handbuch (German edition of the Technical Reference Manual), 1st ed. 1987, Guenter Holtkoetter GmbH, Hamburg"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/PC-1600_System_Handbuch_Holtkoetter.pdf"
    note: "316 PDF pages, the TRM's chapter and section numbering (3.1 Display ... 7.1 CPU). Holtkoetter is the publisher, not an author. This is 'the German Systemhandbuch scan' the documents read TRM sections from. Not to be confused with OHEIMB-1600 or BAUM-1600."
  - id: OHEIMB-1600
    title: "David von Oheimb, Das Systemhandbuch fuer den PC-1600, ISBN 3-925641-08-4, Klaus Ditze Verlag, Weilerswist, 1987 (German)"
    rank: 3
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Sharp PC-1600 Systemhandbuch Ditze-vonOheimb.pdf"
    note: "A separate third-party book with its own structure: chapters 1-15 (13 Diskettenlaufwerk, 14 Dateien) and Anhang 1-9 (6 I/O-Adressen, 7 System-RAM, 8 Sprungtabelle). Printed page = PDF page - 1: Anhang 6 is PDF pp.95-97, Anhang 7 PDF pp.98-115, Anhang 8 PDF pp.116-123. Older documents cite it as 'SHARP-PC1600-Systemhandbuch.pdf'."
  - id: DITZE-TIPS-1600
    title: "Klaus Ditze, Programme, Tips & Tricks fuer den PC-1600, ISBN 3-925641-04-1, Klaus Ditze Verlag, 1987 (German)"
    rank: 3
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Tips_Tricks_Ditze_Optimize.pdf"
    note: "BASIC and machine-code listings; source of the disk-MERGE (pp.9-12) and DISKCOPY (pp.35-36) routines."
  - id: BAUM-1600
    title: "Winfried Baum, PC-1600 Systemhandbuch, ISBN 3-924327-31-9 (German)"
    rank: 3
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Systemhandbuch_fischel.pdf"
    note: "Fischel GmbH. Printed page = PDF page - 1; the documents cite printed pages. A separate, third-party book despite the shared title. Anhang A (I/O port list, printed pp.93-97) is the source for the ON-key live level, the 17H cassette sync tone and the 18H b7/b6 meaning."
  - id: SM-1600
    title: "PC-1600 Service Manual"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/PC-1600_Service_Manual.pdf"
    note: "118 PDF pages, printed page = PDF page - 3. The key circuit diagram (HD61203/HD61102/TC8576F wiring, LCD glass pinout with the status legend) is printed pp.43-44 = PDF pp.46-47: render it (pdftoppm -r 400-800), the OCR of schematics is useless. Also covers CE-1600P/F/M/L, CE-1601L-1609L. Hardware architecture, schematics, the LR38041 gate array, slot pinouts, CE-1600P chapter pp.63-72, CE-1600F chapter pp.98-104."
  - id: BEDIEN-1600
    title: "PC-1600 Bedienungsanleitung (German user manual)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/PC-1600_Bedienungsanleitung.pdf"
    note: "A longer scan of the same manual: PC-1600 user manual-de.pdf. Memory map (App. D), machine-language commands and PC-1500 compatibility (App. E/H)."
  - id: OPMAN-1600
    title: "PC-1600 Operation Manual (English user manual)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/PC-1600_Operation_Manual.pdf"
    note: "PDF page = printed page + 10."
  - id: SM-CE1601M
    title: "CE-1601M Service Manual"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/CE-1601M.pdf"
  - id: SUPERRAM
    title: "superRAM manual (third-party module)"
    rank: 4
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/SuperRAM.pdf"
    note: "Revision 2, 256KB / 2x256KB / 512KB. Source for the vertical-bank mechanism of the modern module."
  - id: TOSHIBA-TC8576
    title: "Toshiba TC8576AF/TC8577AP/TC8578AP Technical Data, 1987 data book, pp.159-196"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Toshiba_TC8576AF_CPC_1987.pdf"
    note: "Extract from Toshiba Microprocessors Vol. 2: Peripherals (1987). 38 pages in the scan: PDF page = data-book page - 158 (register table: printed p.165 = PDF p.7). Re-OCRed: prose reads well with pdftotext -layout (without -layout the order scrambles); the register and pin tables are still noisy, read the page images."
  - id: HITACHI-HD61102
    title: "Hitachi HD61102 Dot Matrix LCD Graphic Display Column Driver (1989 data book pp.261-290)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Hitachi_HD61102_1989.pdf"
    note: "Extract from the Hitachi LCD Controller/Driver LSI Data Book U74 (1989); printed page = data-book PDF page - 13; text layer present."
  - id: HITACHI-HD61203
    title: "Hitachi HD61203 Dot Matrix LCD Graphic Display Common Driver (1989 data book pp.361-387)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Hitachi_HD61203_1989.pdf"
  - id: SOFT-INFO
    title: "SHARP SOFTWARE-INFO bulletins 1600-010E, -011, -012, -014G, -015G (Sharp Electronics Europe, Software Center Hamburg, 1987-88)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1600/Sharp-Soft-Info.pdf"
    note: "Primary Sharp material but advisory: dealer errata and tips (firmware bugs, workarounds, the BASIC ROM revision split)."
  - id: TRM-1500
    title: "PC-1500 Technical Reference Manual (English)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/PC-1500_Technical_Reference_Manual.pdf"
    note: "LH5811 register pages: printed pp.69-72 = PDF pp.74-77; the OCR there is poor, read the page images."
  - id: SM-1500
    title: "PC-1500 Service Manual"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/PC-1500_Service_Manual.pdf"
  - id: SM-CE150
    title: "CE-150 Color Graphic Printer Service Manual (English)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/CE-150 Service_Manual_engl.pdf"
    note: "Electrical pages are 61-62 of the PDF."
  - id: SM-CE161
    title: "CE-161 Service Manual (16 KB RAM module, flat LSI type)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/Sharp_CE-161_Service_Manual.pdf"
  - id: MAN-CE158
    title: "CE-158 Instruction Manual (US edition)"
    rank: 2
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/CE-158X_Users_Manual/CE-158_US_Instruction_manual.pdf"
  - id: SM-CE158
    title: "CE-158 Service Manual"
    rank: 2
    note: "Read online (ManualsLib); no local copy."
  - id: SCHLIEKER-INTERN
    title: "H.-G. Schlieker, PC-1500 Intern: kommentiertes Betriebssystem (German)"
    rank: 3
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/PC-1500_Intern.pdf"
  - id: SCHLIEKER-ROM
    title: "H.-G. Schlieker, SHARP PC-1500 ROM-Unterprogramme, 1983 (German)"
    rank: 3
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/ROM-Unterprogramme.pdf"
    note: "Source of the VMJ/VEJ table; contains known address errors (see Firmware/PC-1500-ROM-Routines.md)."
  - id: ELLIOTT-PC2
    title: "Bruce Elliott, PC-2 Assembly Language, article series, TRS-80 Microcomputer News, 1983-84"
    rank: 4
    local: "~/SynologyDrive/Dokumente/PDF/Vintage/Sharp/PC-1500/Sharp PC 1500 Assembly .pdf"
    note: "p.5 memory map, pp.25-29 ROM call entry/exit conditions."
  - id: ROM-PC1600
    title: "PC-1600 ROM dumps and annotated disassemblies, repository PC-1600-ROM (dumped from real hardware, September 2026)"
    rank: 1
  - id: ROM-PC1500
    title: "PC-1500 ROM disassemblies A01/A03/A04, repository PC-1500-ROM, and Jeff Birt's Sharp_PC-1500_ROM_Disassembly"
    rank: 1
  - id: EMU-POCKEMUL
    title: "PockEmul, a multi-pocket-computer emulator (includes a PC-1600 implementation)"
    rank: 5
    note: "Not a primary source: one reverse-engineer's reading of the hardware. It was used to cross-check the memory/bank model and to resolve ambiguities (e.g. keyboard strobe/sense binding, LCD port decode). One answer was wrong: it models the SC-7852 without wait states, while real-hardware BEEP pitch shows one wait per M1 cycle (CPU/PC-1600-SC7852-Z80.md 2.3). Where a fact rests on this implementation alone, the document says so."
